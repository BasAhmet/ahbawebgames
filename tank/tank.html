<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Savaşı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0f172a; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: sans-serif;
        }
        
        canvas {
            background-color: #1e293b;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            aspect-ratio: 8 / 6;
            z-index: 1; 
        }

        #joystick-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 70%;
            height: 100%;
            z-index: 5; 
        }

        #fireButton {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 90px;
            height: 90px;
            background-color: #ef4444;
            color: white;
            border: 4px solid #fca5a5;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            user-select: none;
            touch-action: manipulation;
        }
        #fireButton:active { background-color: #dc2626; transform: scale(0.95); }

        .geri-don {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 999;
        }

        #roomInfoDisplay {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #0ea5e9;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 999;
            display: none;
        }

        .overlay-menu {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #38bdf8;
            color: white;
            z-index: 999;
            gap: 15px;
            text-align: center;
        }

        .mp-btn {
            width: 100%;
            padding: 12px 24px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .mp-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #334155;
            background-color: #1e293b;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            text-transform: uppercase;
        }
        #gameOverlay { display: none; }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>
    <button id="fireButton">🔥 ATEŞ</button>
    <button class="geri-don" onclick="window.location.href='../index.html'">⬅ Menüye Dön</button>
    <div id="roomInfoDisplay"></div>
    
    <div id="mpMenu" class="overlay-menu">
        <h2>Tank Savaşı</h2>
        <button id="btnHostInit" class="mp-btn">🏠 Oda Kur (Host)</button>
        <div style="width: 100%; height: 2px; background: #334155;"></div>
        <input type="text" id="joinCodeInput" class="mp-input" placeholder="Oda Kodu" maxlength="4">
        <button id="btnJoin" class="mp-btn" style="background-color: #10b981;">🤝 Odaya Katıl</button>
    </div>

    <div id="waitingScreen" class="overlay-menu" style="display: none;">
        <h2>Oyuncu Bekleniyor...</h2>
        <h1 id="waitingCode" style="color: #f59e0b; margin: 10px 0;"></h1>
    </div>

    <div id="gameOverlay" class="overlay-menu">
        <h2 id="winnerText">Oyun Bitti</h2>
        <button id="btnRestartRound" class="mp-btn">Yeniden Başlat</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script type="module" src="tank.js"></script>
</body>
</html>
