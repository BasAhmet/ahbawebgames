<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumo Arenası</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0f172a; 
            overflow: hidden; /* Kaydırma çubuklarını gizler */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #1e293b;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .geri-don {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background-color: #334155;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: sans-serif;
            font-weight: bold;
        }
        /* Oyun Bitti Arayüzü */
        #gameOverlay {
            display: none; /* Başlangıçta gizli */
            position: absolute;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 30px 50px;
            border-radius: 16px;
            border: 2px solid #38bdf8;
            color: white;
            text-align: center;
            z-index: 20;
        }
        #gameOverlay h2 { font-size: 2rem; margin-bottom: 10px; }
        #gameOverlay p { font-size: 1.2rem; margin-bottom: 20px; color: #94a3b8; }
        #restartBtn {
            padding: 12px 24px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        #restartBtn:hover { background-color: #0284c7; }
    </style>
</head>
<body>
    <a href="../index.html" class="geri-don">⬅ Menüye Dön</a>
    <!-- Oyun Sonu Ekranı -->
    <div id="gameOverlay">
        <h2 id="winnerText">Oyun Bitti</h2>
        <p id="winnerSubText"></p>
        <button id="restartBtn" onclick="resetGame()">Yeniden Başla</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script src="sumo.js"></script>
</body>
</html>
